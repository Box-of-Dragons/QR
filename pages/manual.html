<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Device Manual — QR</title>
    <meta name="description" content="Official device manual.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <script>(function(){var h=location.hostname;var l=h==='localhost'||h==='127.0.0.1'||h.indexOf('.ddev.site')!==-1;var b=(l?'http://localhost:4000':'https://misssponto.me.uk');document.write('<link rel="stylesheet" href="'+b+'/css/shared.css">');})();</script>
    <link rel="stylesheet" href="/css/site.css">
    <style>
        .manual-page {
            font-family: 'Courier New', Courier, monospace;
            border: 2px solid var(--body);
            padding: 40px;
            max-width: 640px;
            margin: 0 auto;
            background: var(--tertiary);
        }
        .manual-page header {
            text-align: center;
            border-bottom: 2px solid var(--body);
            padding-bottom: 16px;
            margin-bottom: 32px;
        }
        .manual-page h2 {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 4px;
            margin: 0;
        }
        .manual-page .manual-meta {
            font-size: 0.85em;
            margin-top: 8px;
        }
        .manual-page ol {
            font-size: 1.4em;
            line-height: 2;
        }
        .manual-page footer {
            border-top: 1px solid var(--body);
            margin-top: 32px;
            padding-top: 12px;
            font-size: 0.8em;
            text-align: center;
        }
    </style>
</head>
<body>
<div id="global-bar"></div>

<main class="page-main">
    <div class="shell">
        <div class="container">
            <div class="panel panel--padded">
                <div class="manual-page">
                    <header>
                        <h2>DEVICE MANUAL</h2>
                        <div class="manual-meta">Model: All of them &nbsp;|&nbsp; Rev. 1.0</div>
                    </header>
                    <p><strong>SYMPTOM:</strong> Device is not working.</p>
                    <p><strong>RESOLUTION:</strong></p>
                    <ol>
                        <li>Turn it off.</li>
                        <li>Turn it on again.</li>
                    </ol>
                    <p>If the problem persists, repeat steps 1&ndash;2.</p>
                    <footer>Page 1 of 1 &nbsp;&mdash;&nbsp; No further documentation exists.</footer>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="/js/footer-links.js"></script>
<div id="site-footer"></div>

<script>
(function () {
    var host = location.hostname;
    var isLocal = host === 'localhost' || host === '127.0.0.1' || host.indexOf('.ddev.site') !== -1;
    var base = (isLocal ? 'http://localhost:4000' : 'https://misssponto.me.uk') + '/js/';
    ['global-bar.js', 'site-footer.js'].forEach(function (file) {
        var s = document.createElement('script');
        s.src = base + file;
        s.defer = true;
        document.head.appendChild(s);
    });
})();
</script>
</body>
</html>
