name: Release

# Releases are always manual — Actions → Release → Run workflow.
# QR deploys by manual scp (the VPS docroot is not a git repo), so the shared
# workflow's deploy job is disabled here — this only plans/syncs/tags/releases.
# All release policy lives in the shared workflow (StructuredChaos docs/git-rules.md).

on:
  workflow_dispatch:

jobs:
  release:
    uses: Box-of-Dragons/StructuredChaos/.github/workflows/family-release.yml@master
    with:
      release-branch: master
      deploy: false
    secrets: inherit
