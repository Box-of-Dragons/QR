<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QR Generator — QR</title>
    <meta name="description" content="Generate printable QR code sticker sheets.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <script>(function(){var h=location.hostname;var l=h==='localhost'||h==='127.0.0.1'||h.indexOf('.ddev.site')!==-1;var b=(l?'http://localhost:4000':'https://misssponto.me.uk');document.write('<link rel="stylesheet" href="'+b+'/css/shared.css">');})();</script>
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/gen.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div id="global-bar"></div>

<section class="page-subheader">
    <div class="shell">
        <div class="page-subheader-inner">
            <h1>QR Generator</h1>
        </div>
    </div>
</section>

<main class="page-main">
    <div class="shell">
        <div class="page-layout">
            <div class="content-main">
                <div class="container">
                    <div class="panel panel--padded">
                        <h3>Stickers</h3>
                        <table class="gen-table">
                            <thead><tr><th>URL</th><th>Text</th><th>Count</th><th></th></tr></thead>
                            <tbody id="gen-rows"></tbody>
                        </table>
                        <button class="gen-add" id="gen-add" type="button">+ Add row</button>
                        <p class="caption">Paste straight from Excel/Sheets — tab-separated cells fill the grid.</p>
                    </div>
                    <div class="panel panel--padded">
                        <h3>Sheet</h3>
                        <div class="gen-preview">
                            <div class="gen-sheet-wrap">
                                <canvas id="gen-sheet"></canvas>
                                <div class="gen-margin-guide" id="gen-margin-guide"></div>
                            </div>
                        </div>
                        <p class="gen-sheet-info caption" id="gen-sheet-info"></p>
                        <div class="gen-actions"><button id="gen-download" type="button">Download PNG (300 DPI)</button></div>
                    </div>
                </div>
            </div>
            <aside class="sidebar">
                <div class="container">
                    <div class="panel panel--padded">
                        <h3>Options</h3>
                        <div class="gen-form">
                            <div class="gen-group">Sticker</div>
                            <label for="gen-size">Sticker width</label>
                            <select id="gen-size">
                                <option value="25">25 mm</option>
                                <option value="38" selected>38 mm</option>
                                <option value="50">50 mm</option>
                                <option value="75">75 mm</option>
                            </select>

                            <label for="gen-height">Sticker height</label>
                            <select id="gen-height">
                                <option value="auto" selected>Auto</option>
                                <option value="25">25 mm</option>
                                <option value="38">38 mm</option>
                                <option value="50">50 mm</option>
                                <option value="63">63 mm</option>
                                <option value="75">75 mm</option>
                            </select>

                            <label for="gen-border">Border</label>
                            <select id="gen-border">
                                <option value="0">None</option>
                                <option value="1" selected>Thin (1 mm)</option>
                                <option value="2">Thick (2 mm)</option>
                            </select>

                            <div class="gen-group">Sheet</div>
                            <label for="gen-page">Page size</label>
                            <select id="gen-page">
                                <option value="single">Single sticker</option>
                                <option value="210x297" selected>A4 (210 × 297 mm)</option>
                                <option value="148x210">A5 (148 × 210 mm)</option>
                                <option value="216x279">Letter (216 × 279 mm)</option>
                            </select>

                            <label for="gen-margin">Page margin</label>
                            <select id="gen-margin">
                                <option value="5">5 mm</option>
                                <option value="10" selected>10 mm</option>
                                <option value="15">15 mm</option>
                                <option value="20">20 mm</option>
                            </select>

                            <label for="gen-gap">Sticker spacing</label>
                            <select id="gen-gap">
                                <option value="0">None</option>
                                <option value="2">2 mm</option>
                                <option value="5" selected>5 mm</option>
                                <option value="10">10 mm</option>
                            </select>

                            <label for="gen-textgap">Caption gap</label>
                            <select id="gen-textgap">
                                <option value="0">None</option>
                                <option value="0.5" selected>0.5 mm</option>
                                <option value="1">1 mm</option>
                                <option value="2">2 mm</option>
                            </select>

                            <label for="gen-fill">Empty slots</label>
                            <select id="gen-fill">
                                <option value="blank" selected>Leave blank</option>
                                <option value="repeat">Repeat stickers to fill</option>
                            </select>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</main>

<script>window.SITE_FOOTER = {
    label: 'QR',
    links: [
        { label: 'Home', href: '/' },
        { label: 'Wi-Fi', href: '/wifi.html' },
        { label: 'Device Manual', href: '/manual.html' },
        { label: 'Scan', href: '/scan.html' },
        { label: 'Generator', href: '/generator.html' },
        { label: 'Text Generator', href: '/text-generator.html' }
    ]
};</script>
<div id="site-footer"></div>

<script src="/js/sheet-pack.js"></script>
<script src="/js/gen-shared.js"></script>
<script>
(function () {
    var host = location.hostname;
    var isLocal = host === 'localhost' || host === '127.0.0.1' || host.indexOf('.ddev.site') !== -1;
    var base = (isLocal ? 'http://localhost:4000' : 'https://misssponto.me.uk') + '/js/';
    ['global-bar.js', 'site-footer.js'].forEach(function (file) {
        var s = document.createElement('script');
        s.src = base + file;
        s.defer = true;
        document.head.appendChild(s);
    });
})();
</script>
<script>
(function () {
    var mmToPx = GenShared.mmToPx;
    var TEXT_MM = 6, PAD_MM = 2;
    var COLS = ['gen-url', 'gen-text', 'gen-count'];
    var rowsEl = document.getElementById('gen-rows');
    var sizeEl = document.getElementById('gen-size');
    var heightEl = document.getElementById('gen-height');
    var borderEl = document.getElementById('gen-border');
    var pageEl = document.getElementById('gen-page');
    var marginEl = document.getElementById('gen-margin');
    var gapEl = document.getElementById('gen-gap');
    var textGapEl = document.getElementById('gen-textgap');
    var fillEl = document.getElementById('gen-fill');
    var sheetCanvas = document.getElementById('gen-sheet');
    var guideEl = document.getElementById('gen-margin-guide');
    var infoEl = document.getElementById('gen-sheet-info');

    function addRow(url, text, count) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td><input type="text" class="gen-url" placeholder="https://…"></td>' +
                       '<td><input type="text" class="gen-text" placeholder="Caption"></td>' +
                       '<td class="gen-count"><input type="number" class="gen-count" min="1" value="1"></td>' +
                       '<td class="gen-del-cell"><button class="gen-del" type="button" title="Remove row">×</button></td>';
        tr.querySelector('.gen-url').value = url || '';
        tr.querySelector('.gen-text').value = text || '';
        tr.querySelector('input.gen-count').value = count || 1;
        tr.querySelector('.gen-del').addEventListener('click', function () { tr.remove(); render(); });
        tr.querySelectorAll('input').forEach(function (inp) { inp.addEventListener('input', render); });
        rowsEl.appendChild(tr);
        return tr;
    }

    function getStickers() {
        var out = [];
        rowsEl.querySelectorAll('tr').forEach(function (tr) {
            var url = tr.querySelector('.gen-url').value.trim();
            var text = tr.querySelector('.gen-text').value.trim();
            var count = Math.max(1, parseInt(tr.querySelector('input.gen-count').value, 10) || 1);
            if (url) out.push({ url: url, text: text, count: count });
        });
        return out;
    }

    var LS_KEY = 'qr-gen-v1';

    function saveState() {
        var rows = [];
        rowsEl.querySelectorAll('tr').forEach(function (tr) {
            rows.push({
                url: tr.querySelector('.gen-url').value,
                text: tr.querySelector('.gen-text').value,
                count: tr.querySelector('input.gen-count').value
            });
        });
        try {
            localStorage.setItem(LS_KEY, JSON.stringify({
                rows: rows,
                opts: {
                    size: sizeEl.value, height: heightEl.value, border: borderEl.value,
                    page: pageEl.value, margin: marginEl.value, gap: gapEl.value,
                    textgap: textGapEl.value, fill: fillEl.value
                }
            }));
        } catch (e) {}
    }

    function loadState() {
        var st;
        try { st = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) {}
        if (!st) return false;
        var map = {
            size: sizeEl, height: heightEl, border: borderEl,
            page: pageEl, margin: marginEl, gap: gapEl,
            textgap: textGapEl, fill: fillEl
        };
        if (st.opts) Object.keys(st.opts).forEach(function (k) {
            if (map[k] && st.opts[k] != null) map[k].value = st.opts[k];
        });
        (st.rows || []).forEach(function (r) { addRow(r.url, r.text, r.count); });
        return true;
    }

    // Excel/Sheets paste: TSV fills the grid starting at the focused cell
    GenShared.attachTsvPaste(rowsEl, COLS, addRow, render);

    document.getElementById('gen-add').addEventListener('click', function () { addRow().querySelector('.gen-url').focus(); });

    // Draws one sticker at (x, y). w/h in px. qr is a made qrcode-generator object.
    // Layout: border | pad | QR square (centered in space above text) | textGap | text | pad | border
    function drawSticker(ctx, x, y, w, h, borderPx, padPx, textGapPx, textPx, text, qr) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, y, w, h);

        if (borderPx > 0) {
            ctx.strokeStyle = '#000';
            ctx.lineWidth = borderPx;
            ctx.strokeRect(x + borderPx / 2, y + borderPx / 2, w - borderPx, h - borderPx);
        }

        var innerX = x + borderPx + padPx;
        var innerY = y + borderPx + padPx;
        var innerW = w - 2 * (borderPx + padPx);
        var innerH = h - 2 * (borderPx + padPx);

        // Text strip anchors to the bottom of the inner area
        var textTop = innerY + innerH - textPx;
        // QR gets the inner area above the text strip minus the gap
        var qrRegionH = textPx > 0 ? (textTop - textGapPx - innerY) : innerH;
        var qrArea = Math.min(innerW, qrRegionH);

        var count = qr.getModuleCount();
        var quiet = 4;
        var cell = Math.max(1, Math.floor(qrArea / (count + quiet * 2)));
        var qrActual = cell * (count + quiet * 2);
        var qrOffX = innerX + Math.floor((innerW - qrActual) / 2);
        var qrOffY = innerY + Math.floor((qrRegionH - qrActual) / 2);
        ctx.fillStyle = '#000';
        for (var r = 0; r < count; r++) {
            for (var c = 0; c < count; c++) {
                if (qr.isDark(r, c)) {
                    ctx.fillRect(qrOffX + (c + quiet) * cell, qrOffY + (r + quiet) * cell, cell, cell);
                }
            }
        }

        if (textPx > 0) {
            ctx.fillStyle = '#000';
            ctx.font = '600 ' + Math.round(textPx * 0.55) + 'px "Open Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x + w / 2, textTop + textPx / 2, innerW);
        }
    }

    function makeQr(url) {
        var qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        return qr;
    }

    function render() {
        var stickers = getStickers();
        var sizeMm = parseInt(sizeEl.value, 10);
        var borderMm = parseInt(borderEl.value, 10);
        var marginMm = parseInt(marginEl.value, 10);
        var single = pageEl.value === 'single';
        var repeat = fillEl.value === 'repeat';

        var borderPx = mmToPx(borderMm);
        var padPx = mmToPx(PAD_MM);
        var stickerW = mmToPx(sizeMm);
        var anyText = stickers.some(function (s) { return s.text; });
        var textGapPx = anyText ? mmToPx(parseFloat(textGapEl.value)) : 0;
        var textPx = anyText ? mmToPx(TEXT_MM) : 0;

        // Height: Auto = width + text strip; fixed = chosen mm (QR shrinks to fit)
        var stickerHmm = heightEl.value === 'auto' ? null : parseInt(heightEl.value, 10);
        var stickerH = stickerHmm ? mmToPx(stickerHmm) : stickerW + textGapPx + textPx;
        var stickerHmmActual = GenShared.pxToMm(stickerH);
        var sizeLabel = sizeMm + ' × ' + stickerHmmActual + ' mm';

        var ctx = sheetCanvas.getContext('2d');

        saveState();

        if (single) {
            sheetCanvas.width = stickerW;
            sheetCanvas.height = stickerH;
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, stickerW, stickerH);
            if (stickers.length) {
                drawSticker(ctx, 0, 0, stickerW, stickerH, borderPx, padPx, textGapPx, textPx,
                    stickers[0].text, makeQr(stickers[0].url));
            }
            infoEl.textContent = 'Single sticker — ' + sizeLabel;
            guideEl.style.display = 'none';
            return;
        }

        var pageParts = pageEl.value.split('x');
        var pageWmm = parseInt(pageParts[0], 10);
        var pageHmm = parseInt(pageParts[1], 10);
        var pageW = mmToPx(pageWmm);
        var pageH = mmToPx(pageHmm);
        var margin = mmToPx(marginMm);
        var gap = mmToPx(parseInt(gapEl.value, 10));
        var innerW = pageW - 2 * margin;
        var innerH = pageH - 2 * margin;

        sheetCanvas.width = pageW;
        sheetCanvas.height = pageH;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, pageW, pageH);

        // Uniform stickers — grid packing, expanded by count, tiled in order
        var queue = GenShared.expandQueue(stickers);
        var result = SheetPack.grid(queue, innerW, innerH, stickerW, stickerH, gap, repeat);
        result.placements.forEach(function (p) {
            drawSticker(ctx, margin + p.x, margin + p.y,
                stickerW, stickerH, borderPx, padPx, textGapPx, textPx, p.s.text, makeQr(p.s.url));
        });
        var placed = result.placements.length;

        // Margin guide bounds exactly where stickers are placed
        GenShared.positionMarginGuide(guideEl, marginMm, pageWmm, pageHmm);

        infoEl.textContent = stickers.length
            ? 'Sticker ' + sizeLabel + ' — ' + placed + ' of ' + result.slots + ' slots filled (' + result.cols + ' × ' + result.rows + ') on ' + pageWmm + ' × ' + pageHmm + ' mm' + GenShared.overflowNote(result.overflow)
            : 'Sticker ' + sizeLabel + ' — add a URL to get started (' + result.slots + ' slots, ' + result.cols + ' × ' + result.rows + ', on ' + pageWmm + ' × ' + pageHmm + ' mm)';
    }

    [sizeEl, heightEl, borderEl, pageEl, marginEl, gapEl, textGapEl, fillEl].forEach(function (el) {
        el.addEventListener('change', render);
    });

    document.getElementById('gen-download').addEventListener('click', function () {
        GenShared.downloadCanvas(sheetCanvas, pageEl.value === 'single'
            ? 'qr-sticker-' + sizeEl.value + 'mm.png'
            : 'qr-sheet-' + pageEl.value + 'mm-' + sizeEl.value + 'mm-stickers.png');
    });

    if (!loadState()) addRow('https://qr.misssponto.me.uk/scan.html', 'SCAN ME', 1);
    render();
})();
</script>
</body>
</html>
